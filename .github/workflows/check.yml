# The one check every repository exposes (Branding-Standards ADRs 0020, 0021): the organisation
# ruleset requires a check named "check". This repository is the organisation profile, so the check
# is: every SVG parses as XML, and every local image or link the Markdown names exists.
# No `paths:` filter: a required check that never starts blocks the merge.
name: check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue runs check again on the queued commit (Branding-Standards ADR 0044).
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: SVGs parse, local references exist
        shell: python
        run: |
          import pathlib, re, sys, urllib.parse, xml.etree.ElementTree as ET
          root = pathlib.Path(".").resolve()
          bad = []
          for svg in root.rglob("*.svg"):
              try:
                  ET.parse(svg)
              except ET.ParseError as e:
                  bad.append(f"{svg.relative_to(root)}: {e}")
          for md in root.rglob("*.md"):
              # [text](target), [text](<tar get>), either with a "title", 'title' or (title); src="…" or src='…'.
              links = r"\]\(\s*(?:<([^>]+)>|([^)\s]+))(?:\s+(?:\"[^\"]*\"|'[^']*'|\([^)]*\)))?\s*\)|src=(?:\"([^\"]+)\"|'([^']+)')"
              for ref in re.findall(links, md.read_text()):
                  target = next(r for r in ref if r)
                  # Any scheme (https:, mailto:, data:, tel:), a protocol-relative //host or an anchor is not a file.
                  if re.match(r"^([A-Za-z][A-Za-z0-9+.-]*:|//|#)", target):
                      continue
                  path = urllib.parse.unquote(re.split(r"[?#]", target)[0])
                  # GitHub resolves a root-relative reference against the repository, never the runner's disk.
                  file = (root / path.lstrip("/") if path.startswith("/") else md.parent / path).resolve()
                  if not file.is_relative_to(root) or not file.exists():
                      bad.append(f"{md.relative_to(root)}: {target} does not exist in the repository")
          print("\n".join(bad) or "ok")
          sys.exit(1 if bad else 0)
